; supervisord service for SpacePush on Uberspace 7.
; Copy to ~/etc/services.d/spacepush.ini, then:
;   supervisorctl reread && supervisorctl update
[program:spacepush]
directory=%(ENV_HOME)s/spacepush
command=%(ENV_HOME)s/spacepush/release/bin/spacepush foreground
environment=RELX_CONFIG_PATH="%(ENV_HOME)s/spacepush/sys.config",VMARGS_PATH="%(ENV_HOME)s/spacepush/vm.args",ERL_EPMD_ADDRESS="127.0.0.1"
autostart=yes
autorestart=yes
startsecs=15
stopwaitsecs=30
